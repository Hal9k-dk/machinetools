name: Hal9k
board: 6x CNC Controller
kinematics:
  Cartesian: {}
start:
  must_home: true
  deactivate_parking: false
  check_limits: true
stepping:
  engine: I2S_STREAM
  idle_ms: 255
  pulse_us: 4
  dir_delay_us: 0
  disable_delay_us: 0
spi:
  miso_pin: gpio.19
  mosi_pin: gpio.23
  sck_pin: gpio.18
sdcard:
  cs_pin: gpio.5
  frequency_hz: 8000000
i2so:
  bck_pin: gpio.22
  data_pin: gpio.21
  ws_pin: gpio.17
  min_pulse_us: 4
axes:
  shared_stepper_disable_pin: NO_PIN
  homing_runs: 2
  x:
    steps_per_mm: 320
    max_rate_mm_per_min: 2000
    acceleration_mm_per_sec2: 400
    max_travel_mm: 600
    soft_limits: true
    # Motor1
    motor0:
      standard_stepper:
        step_pin: i2so.2:high
        direction_pin: i2so.1:high
        disable_pin: i2so.0:high
      hard_limits: false
      # IO34
      limit_neg_pin: gpio.34:low:pu
    homing:
      cycle: 1
      positive_direction: false
      mpos_mm: 0
      feed_mm_per_min: 50
      seek_mm_per_min: 200
      settle_ms: 250
      seek_scaler: 1.1
      feed_scaler: 1.1
  y:
    steps_per_mm: 320
    max_rate_mm_per_min: 2000
    acceleration_mm_per_sec2: 400
    max_travel_mm: 900
    soft_limits: false
    # Motor2
    motor0:
      standard_stepper:
        step_pin: i2so.5:high
        direction_pin: i2so.4:high
        disable_pin: i2so.7:high
      hard_limits: false
      # IO39
      limit_neg_pin: gpio.39:low:pu
    homing:
      cycle: 1
      positive_direction: false
      mpos_mm: 0
      feed_mm_per_min: 50
      seek_mm_per_min: 200
      settle_ms: 250
      seek_scaler: 1.1
      feed_scaler: 1.1
  z:
    steps_per_mm: 320
    max_rate_mm_per_min: 2000
    acceleration_mm_per_sec2: 400
    max_travel_mm: 100
    soft_limits: true
    # Motor3
    motor0:
      standard_stepper:
        step_pin: i2so.10:high
        direction_pin: i2so.9:high
        disable_pin: i2so.8:high
      hard_limits: false
      # IO36
      limit_pos_pin: gpio.36:low
    homing:
      cycle: 2
      positive_direction: true
      mpos_mm: 0
      feed_mm_per_min: 50
      seek_mm_per_min: 200
      settle_ms: 250
      seek_scaler: 1.1
      feed_scaler: 1.1
  a:
    steps_per_mm: 10
    max_rate_mm_per_min: 1000
    acceleration_mm_per_sec2: 400
    max_travel_mm: 1000
    soft_limits: false
    # Motor4
    motor0:
      standard_stepper:
        step_pin: i2so.13:high
        direction_pin: i2so.12:high
        disable_pin: i2so.15:high
      hard_limits: false
control:
  # IO35
  estop_pin: gpio.35:high:pu
probe:
  # IO32
  toolsetter_pin: gpio.32:low
  check_mode_start: true
  hard_stop: false
  probe_hard_limit: true
10V:
  tool_num: 0
  speed_map: 0=0% 0=30% 6000=30% 20000=100%
  off_on_alarm: true
  atc: ''
  m6_macro: ''
  s0_with_disable: false
  disable_with_s0: false
  spinup_ms: 0
  spindown_ms: 0
  pwm_hz: 5000
  # 0-10V - 10v gpio.13
  output_pin: gpio.13
arc_tolerance_mm: 0.002
junction_deviation_mm: 0.01
verbose_errors: true
report_inches: false
enable_parking_override_control: false
use_line_numbers: false
planner_blocks: 16
